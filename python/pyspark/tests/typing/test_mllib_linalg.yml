- case: mllibVectorIndexing
  main: |
    from typing import assert_type

    import numpy as np

    from pyspark.mllib.linalg import DenseVector, SparseVector, Vector

    def check_vector(vector: Vector) -> None:
        assert_type(vector[0], np.float64)
        assert_type(vector[-1], np.float64)

    dense = DenseVector([1.0, 2.0])
    sparse = SparseVector(2, {1: 2.0})
    check_vector(dense)
    check_vector(sparse)
    assert_type(dense[0], np.float64)
    assert_type(sparse[0], np.float64)
    assert_type(dense[:], np.ndarray)
