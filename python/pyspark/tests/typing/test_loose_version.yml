- case: looseVersionComparisonTypes
  main: |
    from typing_extensions import assert_type
    from pyspark.loose_version import LooseVersion

    version = LooseVersion("1.2.3")
    for other in (LooseVersion("1.2.4"), "1.2.4"):
        assert_type(version == other, bool)
        assert_type(version < other, bool)
        assert_type(version <= other, bool)
        assert_type(version > other, bool)
        assert_type(version >= other, bool)
        assert_type(other == version, bool)
        assert_type(other < version, bool)
        assert_type(other <= version, bool)
        assert_type(other > version, bool)
        assert_type(other >= version, bool)
    assert_type(version == object(), bool)

- case: looseVersionRejectsUnsupportedOrdering
  main: |
    from pyspark.loose_version import LooseVersion

    version = LooseVersion("1.2.3")
    version < 1.1  # E: Unsupported operand types for < ("LooseVersion" and "float")  [operator]
    version <= 1.1  # E: Unsupported operand types for <= ("LooseVersion" and "float")  [operator]
    version > 1.1  # E: Unsupported operand types for > ("LooseVersion" and "float")  [operator]
    version >= 1.1  # E: Unsupported operand types for >= ("LooseVersion" and "float")  [operator]
