- case: mlDenseVectorArithmetic
  main: |
    from fractions import Fraction
    from typing import assert_type
    import numpy as np
    from pyspark.ml.linalg import DenseVector, SparseVector

    def check(dense: DenseVector, other: DenseVector, array: np.ndarray) -> None:
        assert_type(-dense, DenseVector)
        assert_type(dense + 2.0, DenseVector)
        assert_type(dense - 2.0, DenseVector)
        assert_type(dense * 2.0, DenseVector)
        assert_type(dense / 2.0, DenseVector)
        assert_type(dense % 2.0, DenseVector)
        assert_type(2.0 + dense, DenseVector)
        assert_type(2.0 - dense, DenseVector)
        assert_type(2.0 * dense, DenseVector)
        assert_type(2.0 / dense, DenseVector)
        assert_type(2.0 % dense, DenseVector)
        assert_type(dense + other, DenseVector)
        assert_type(dense - other, DenseVector)
        assert_type(dense * other, DenseVector)
        assert_type(dense / other, DenseVector)
        assert_type(dense % other, DenseVector)
        assert_type(dense + [1.0, 2.0], DenseVector)
        assert_type(dense - [1.0, 2.0], DenseVector)
        assert_type(dense * [1.0, 2.0], DenseVector)
        assert_type(dense / [1.0, 2.0], DenseVector)
        assert_type(dense % [1.0, 2.0], DenseVector)
        # Keep the DenseVector on the left so its operator is invoked.
        assert_type(dense + array, DenseVector)
        assert_type(dense - array, DenseVector)
        assert_type(dense * array, DenseVector)
        assert_type(dense / array, DenseVector)
        assert_type(dense % array, DenseVector)
        sparse = SparseVector(2, {0: 1.0, 1: 2.0})
        assert_type(dense + sparse, DenseVector)
        assert_type(dense - sparse, DenseVector)
        assert_type(dense * sparse, DenseVector)
        assert_type(dense / sparse, DenseVector)
        assert_type(dense % sparse, DenseVector)
        assert_type(sparse + dense, DenseVector)
        assert_type(sparse - dense, DenseVector)
        assert_type(sparse * dense, DenseVector)
        assert_type(sparse / dense, DenseVector)
        assert_type(sparse % dense, DenseVector)
        assert_type(dense * Fraction(1, 2), DenseVector)
        assert_type(Fraction(1, 2) * dense, DenseVector)

