- case: mllibVectorsFromML
  main: |
    from typing import assert_type
    from pyspark.ml import linalg as newlinalg
    from pyspark.mllib.linalg import DenseVector, SparseVector, Vector, Vectors

    assert_type(Vectors.fromML(newlinalg.DenseVector([1.0, 2.0])), DenseVector)
    assert_type(Vectors.fromML(newlinalg.SparseVector(2, {0: 1.0})), SparseVector)

    def check(vector: newlinalg.Vector) -> None:
        assert_type(Vectors.fromML(vector), Vector)
