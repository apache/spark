- case: mlVectorFactories
  main: |
    from typing import Iterable, assert_type
    import numpy as np
    from pyspark.ml.linalg import DenseVector, SparseVector, Vectors

    def check(elements: Iterable[float], array: np.ndarray) -> None:
        assert_type(Vectors.dense(elements), DenseVector)
        assert_type(Vectors.dense(array), DenseVector)

    assert_type(Vectors.dense(1.0, 2.0), DenseVector)
    assert_type(Vectors.dense([1.0, 2.0]), DenseVector)
    assert_type(Vectors.dense((1.0, 2.0)), DenseVector)
    assert_type(Vectors.dense(range(2)), DenseVector)
    assert_type(Vectors.dense(np.array([1.0, 2.0], dtype=np.float64).tobytes()), DenseVector)
    assert_type(Vectors.sparse(2, {0: 1.0, 1: 2.0}), SparseVector)
    assert_type(Vectors.sparse(2, [(0, 1.0), (1, 2.0)]), SparseVector)
    assert_type(Vectors.sparse(2, [0, 1], [1.0, 2.0]), SparseVector)
    indices = np.array([0, 1], dtype=np.int32)
    values = np.array([1.0, 2.0], dtype=np.float64)
    assert_type(Vectors.sparse(2, indices, values), SparseVector)
    assert_type(Vectors.sparse(2, indices.tobytes(), values.tobytes()), SparseVector)

