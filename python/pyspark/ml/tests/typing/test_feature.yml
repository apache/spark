- case: mlVectorDot
  main: |
    from typing import Union, assert_type
    import numpy as np
    from pyspark.ml.linalg import DenseVector, SparseVector

    dense = DenseVector([1.0, 2.0])
    sparse = SparseVector(2, {0: 1.0, 1: 2.0})
    assert_type(dense.dot([1.0, 2.0]), np.float64)
    assert_type(dense.dot((1.0, 2.0)), np.float64)
    assert_type(dense.dot(range(2)), np.float64)
    assert_type(dense.dot(dense), np.float64)
    assert_type(dense.dot(sparse), np.float64)
    assert_type(sparse.dot([1.0, 2.0]), np.float64)
    assert_type(sparse.dot((1.0, 2.0)), np.float64)
    assert_type(sparse.dot(range(2)), np.float64)
    assert_type(sparse.dot(dense), np.float64)
    assert_type(sparse.dot(sparse), np.float64)

    # Unknown shape and dtype cannot guarantee a float64 scalar result.
    def check(array: np.ndarray) -> None:
        assert_type(dense.dot(array), Union[float, complex, np.generic, np.ndarray])
        assert_type(sparse.dot(array), Union[float, complex, np.generic, np.ndarray])

