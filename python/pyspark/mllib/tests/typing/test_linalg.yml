- case: mllibVectorDot
  main: |
    from typing import Union
    from typing_extensions import assert_type
    import numpy as np
    from pyspark.mllib._typing import VectorLike
    from pyspark.mllib.linalg import DenseVector, SparseVector, Vector

    def check_dot(
        vector: Vector,
        dense: DenseVector,
        sparse: SparseVector,
        array: np.ndarray,
        other: VectorLike,
    ) -> None:
        assert_type(vector.dot(vector), np.float64)
        assert_type(dense.dot(vector), np.float64)
        assert_type(sparse.dot(vector), np.float64)
        assert_type(vector.dot([1.0, 2.0]), np.float64)
        assert_type(vector.dot((1.0, 2.0)), np.float64)
        assert_type(vector.dot(range(2)), np.float64)
        # An ndarray's type does not distinguish vector and matrix operands.
        assert_type(vector.dot(array), Union[np.float64, np.ndarray])
        assert_type(dense.dot(array), Union[np.float64, np.ndarray])
        assert_type(sparse.dot(array), Union[np.float64, np.ndarray])
        # VectorLike also includes SciPy sparse matrices and arrays.
        assert_type(vector.dot(other), Union[np.float64, np.ndarray])
        assert_type(dense.dot(other), Union[np.float64, np.ndarray])
        assert_type(sparse.dot(other), Union[np.float64, np.ndarray])
