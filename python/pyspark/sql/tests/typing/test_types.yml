- case: structTypeIndexing
  main: |
    from typing import Union, assert_type
    from pyspark.sql.types import IntegerType, StringType, StructField, StructType

    schema = StructType([
        StructField("name", StringType()),
        StructField("age", IntegerType()),
    ])

    assert_type(schema["name"], StructField)
    assert_type(schema[0], StructField)
    assert_type(schema[-1], StructField)
    assert_type(schema[:1], StructType)
    assert_type(schema[1:], StructType)
    assert_type(schema[:], StructType)
    assert_type(schema[::2], StructType)
    assert_type(schema[::-1], StructType)
    assert_type(schema[:1].fieldNames(), list[str])

    def get_fields(key: Union[str, int, slice]) -> None:
        assert_type(schema[key], Union[StructField, StructType])
