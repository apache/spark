name: "Branch-3.5 CI Scheduler"

on:
  schedule:
    - cron: &scala213_cron '17 3 * * 0'
    - cron: &python_3_9_cron '17 9 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: Target workflow to run
        required: true
        type: choice
        default: all
        options:
          - all
          - scala213
          - python_3.9

jobs:
  schedule:
    if: github.repository == 'apache/spark'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCALA213_CRON: *scala213_cron
      PYTHON_3_9_CRON: *python_3_9_cron
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Spark repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: dev
      - name: Scala 2.13 Build
        if: >-
          github.event.schedule == env.SCALA213_CRON ||
          (github.event_name == 'workflow_dispatch' &&
            (inputs.target == 'scala213' || inputs.target == 'all'))
        run: |
          ./dev/dispatch-if-changed.sh build_scala213.yml branch-3.5
      - name: Python 3.9 Build
        if: >-
          github.event.schedule == env.PYTHON_3_9_CRON ||
          (github.event_name == 'workflow_dispatch' &&
            (inputs.target == 'python_3.9' || inputs.target == 'all'))
        run: |
          ./dev/dispatch-if-changed.sh build_python_3.9.yml branch-3.5
