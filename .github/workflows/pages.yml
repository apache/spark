name: GitHub Pages deployment

on:
  # Deploy the latest master documentation artifact once a day.
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

concurrency:
  group: 'docs preview'
  cancel-in-progress: false

jobs:
  docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      pages: write
    environment:
      name: github-pages # https://github.com/actions/deploy-pages/issues/271
    if: github.repository == 'apache/spark'
    steps:
      - name: Find latest documentation preview
        id: preview
        uses: actions/github-script@v9
        with:
          script: |
            for await (const {data} of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              {...context.repo, name: 'docs-preview', per_page: 100}
            )) {
              const artifact = data.find(artifact =>
                !artifact.expired && artifact.workflow_run?.head_branch === 'master');
              if (artifact) {
                core.setOutput('run-id', artifact.workflow_run.id);
                core.info(`Deploying documentation from ${artifact.workflow_run.head_sha}`);
                return;
              }
            }
            core.setFailed('No unexpired master documentation preview artifact is available.');
      - name: Download documentation preview
        uses: actions/download-artifact@v8
        with:
          name: docs-preview
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.preview.outputs.run-id }}
      - name: Extract documentation preview
        run: tar xjf site.tar.bz2
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
