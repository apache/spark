name: GitHub Pages deployment

on:
  # Deploy the latest master documentation artifact once a day.
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

concurrency:
  group: 'docs preview'
  cancel-in-progress: false

jobs:
  docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      pages: write
    environment:
      name: github-pages # https://github.com/actions/deploy-pages/issues/271
    if: github.repository == 'apache/spark'
    steps:
      - name: Find latest documentation preview
        id: preview
        uses: actions/github-script@v9
        with:
          script: |
            let latest;
            for await (const {data} of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              {...context.repo, per_page: 100}
            )) {
              for (const artifact of data) {
                if (artifact.name.startsWith('docs-preview-master-') && !artifact.expired &&
                    artifact.workflow_run?.head_branch === 'master' &&
                    (!latest || artifact.created_at > latest.created_at ||
                     (artifact.created_at === latest.created_at && artifact.id > latest.id))) {
                  latest = artifact;
                }
              }
            }
            if (!latest) {
              core.setFailed('No unexpired master documentation preview artifact is available.');
              return;
            }
            core.setOutput('artifact-id', latest.id);
            core.setOutput('run-id', latest.workflow_run.id);
            core.info(`Deploying ${latest.name} built at ${latest.created_at}`);
      - name: Download documentation preview
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.preview.outputs.artifact-id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.preview.outputs.run-id }}
      - name: Extract documentation preview
        run: tar xjf site-*.tar.bz2
      - name: Prepare documentation preview
        env:
          RELEASE_VERSION: In-Progress
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          import re

          version = os.environ['RELEASE_VERSION']
          replacement = rf'\g<1>{version}\2'

          def prepare(path, patterns):
              original = path.read_text(encoding='utf-8')
              preview = original
              for pattern in patterns:
                  preview = re.sub(pattern, replacement, preview)
              if preview != original:
                  path.write_text(preview, encoding='utf-8')

          patterns = (
              r'(<title>.* - Spark )[^<]+( Documentation</title>)',
              r'(<span class="version">)[^<]+(</span>)',
              r"""('facetFilters':\s*\[\s*["']version:)[^"']+(["'])""",
              r'(<title>[^<]*PySpark )[^<]+( documentation</title>)',
              r"""(DOCUMENTATION_OPTIONS\.theme_switcher_version_match\s*=\s*['"])[^'"]+(['"])""",
          )
          site = Path('docs/_site')
          for path in site.rglob('*.html'):
              prepare(path, patterns)
          options = site / 'api/python/_static/documentation_options.js'
          if options.is_file():
              prepare(options, (r"""(\bVERSION:\s*['"])[^'"]*(['"])""",))
          PYTHON
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
