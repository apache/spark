name: GitHub Pages deployment

on:
  push:
    branches:
      - master

jobs:
  check-commit-count:
    name: Check commit count
    if: github.repository == 'apache/spark' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.count.outputs.should-run }}
    steps:
      - name: Check out the full branch history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this is every tenth commit
        id: count
        run: |
          count=$(git rev-list --count HEAD)
          remainder=$((count % 10))

          if ((remainder == 0)); then
            should_run=true
            icon=":white_check_mark:"
            title="Commit count matched"
            details="Commit count $count is divisible by 10."
          else
            should_run=false
            icon=":pause_button:"
            title="Commit count not matched"
            details="Commit count $count is not divisible by 10."
          fi

          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Commit count: $count"
          echo "Remainder: $remainder"
          echo "Should run: $should_run"
          echo "Details: $details"
          echo "::notice title=$title::$details"
          echo "### $icon Commit count check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit count: $count" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remainder: $remainder" >> "$GITHUB_STEP_SUMMARY"
          echo "- Should run: $should_run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Details: $details" >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Build and deploy documentation
    needs: check-commit-count
    concurrency:
      group: 'docs preview'
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages # https://github.com/actions/deploy-pages/issues/271
    container:
      image: ghcr.io/apache/spark/apache-spark-github-action-image-docs-cache:master-static
    env:
      SPARK_TESTING: 1 # Reduce some noise in the logs
      RELEASE_VERSION: 'In-Progress'
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    if: needs.check-commit-count.outputs.should-run == 'true'
    steps:
      - name: Checkout Spark repository
        uses: actions/checkout@v7
        with:
          repository: apache/spark
          ref: 'master'
      - name: Add GITHUB_WORKSPACE to git trust safe.directory
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Free up disk space
        run: ./dev/free_disk_space_container
      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Install dependencies for documentation generation
        run: |
          # Keep the version of Bundler here in sync with the following locations:
          #   - dev/create-release/spark-rm/Dockerfile
          #   - docs/README.md
          gem install bundler -v 2.4.22
          cd docs
          bundle install --retry=100
      - name: Run documentation build
        run: |
          sed -i".tmp1" 's/SPARK_VERSION:.*$/SPARK_VERSION: '"$RELEASE_VERSION"'/g' docs/_config.yml
          sed -i".tmp2" 's/SPARK_VERSION_SHORT:.*$/SPARK_VERSION_SHORT: '"$RELEASE_VERSION"'/g' docs/_config.yml
          sed -i".tmp3" "s/'facetFilters':.*$/'facetFilters': [\"version:$RELEASE_VERSION\"]/g" docs/_config.yml
          sed -i".tmp4" 's/__version__: str = .*$/__version__: str = "'"$RELEASE_VERSION"'"/' python/pyspark/version.py
          cd docs
          SKIP_RDOC=1 bundle exec jekyll build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
