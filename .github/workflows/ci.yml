name: CI

on:
  push:
    branches: [ feature/codejt ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/codejt/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r codejt/requirements.txt ruff pip-audit

      - name: Lint (ruff)
        run: ruff check codejt

      - name: Security scan (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        working-directory: codejt
        run: pytest -q
