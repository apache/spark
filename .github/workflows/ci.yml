name: CI

on:
  push:
    branches: [ feature/codejt ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r codejt/requirements.txt
      - name: Run tests
        working-directory: codejt
        run: |
          pytest -q
