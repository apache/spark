name: "Sample post-merge Build"

on:
  push:
    branches:
    - branch-4.x

jobs:
  sample-build:
    name: Sample commit and dispatch Build
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - name: Sample commit and dispatch Build
        uses: actions/github-script@v8
        with:
          script: |
            const upstream = process.env.GITHUB_REPOSITORY === 'apache/spark';
            // A fixed SHA prefix gives a deterministic sample without fetching Git history.
            const bucket = parseInt(context.sha.slice(0, 8), 16) % 10;
            const shouldRun = !upstream || bucket === 0;
            await core.summary
              .addHeading('Post-merge Build sampling')
              .addTable([
                [{data: 'Property', header: true}, {data: 'Value', header: true}],
                ['Branch', context.ref.replace('refs/heads/', '')],
                ['Commit', context.sha],
                ['Hash bucket', String(bucket)],
                ['Sampling', upstream ? 'Approximately 10%' : 'Disabled on forks'],
                ['Build selected', String(shouldRun)]
              ])
              .write();
            core.notice(`Build ${shouldRun ? 'selected' : 'skipped'} for ${context.sha}.`);
            if (!shouldRun) return;

            const subject = context.payload.head_commit.message.split('\n')[0];
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'build_main.yml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: {
                sha: upstream ? context.sha : '',
                before: upstream ? context.payload.before : '',
                title: `${subject} (${context.sha.slice(0, 7)})`
              }
            });
