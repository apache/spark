# Publishes the status of each open PR's fork build as a `Build` check on the PR.
# Fork builds still run in contributors' forks on push (build_main.yml); this
# workflow only reports their results. Running on a schedule avoids
# `pull_request_target` and needs no maintainer approval for fork PRs.
#
# Each pass synchronizes existing `Build` checks with their fork runs. For PRs from
# non-master fork branches, a missing check is created with the state of the run for
# the PR head commit and synchronized on later passes. If no usable run exists, or
# the PR is from the fork's master, an `action_required` check directs contributors
# to enable Actions or use a non-master branch. Older master-branch builds may exist,
# but new Build checks are not created for them. GitHub may delay or drop scheduled
# runs, so neither the initial check nor result updates are immediate.

name: Build Status

on:
  schedule:
  # Quick sync: open PRs updated in the last QUICK_SYNC_LOOKBACK_DAYS (set in the script).
  - cron: "*/10 * * * *"
  # Full sync: all open PRs every 4 hours, between quick syncs and away from the busy top of
  # the hour and midnight UTC, when GitHub delays or drops scheduled runs.
  # FULL_SYNC below must match this schedule.
  - cron: "35 2-22/4 * * *"

# Passes do not overlap, so two passes cannot both create a missing Build check.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Update
    if: github.repository == 'apache/spark'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout build status script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/update_build_status.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Sync status updates
        uses: actions/github-script@v9
        env:
          FULL_SYNC: ${{ github.event.schedule == '35 2-22/4 * * *' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Retry server errors (including GraphQL timeouts) and 429s with a short backoff.
          retries: 3
          script: |
            await require(process.env.GITHUB_WORKSPACE
              + '/.github/workflows/update_build_status.js')({github, context, core})
