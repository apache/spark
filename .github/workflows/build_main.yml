name: "Build"
run-name: ${{ inputs.title || github.event.head_commit.message }}

on:
  push:
    branches-ignore:
    - branch-4.x
  workflow_dispatch:
    inputs:
      sha:
        description: Commit selected for the post-merge build
        required: false
        type: string
      before:
        description: Previous commit used for change detection
        required: false
        type: string
      title:
        description: Commit subject for the workflow run
        required: false
        type: string

jobs:
  call-build-and-test:
    permissions:
      packages: write
    name: Run
    uses: ./.github/workflows/build_and_test.yml
    with:
      ref: ${{ inputs.sha }}
      base-sha: ${{ inputs.before }}
