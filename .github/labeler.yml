# Keep labels and globs sorted, with exclusions (!) after the globs they narrow.

AVRO:
  - changed-files:
    - any-glob-to-any-file: [
        'connector/avro/**/*',
        'python/**/avro/**/*',
        ]

BLOCK MANAGER:
  - changed-files:
    - all-globs-to-any-file: [
        'core/src/**/storage/**/*',
        '!**/ui/**/*',
        ]
    - any-glob-to-any-file: [
        'common/utils/src/**/storage/**/*',
        ]

BUILD:
  - changed-files:
    - all-globs-to-any-file: [
        'dev/**/*',
        '!dev/create_jira_and_branch.py',
        '!dev/create_spark_jira.py',
        '!dev/merge_spark_pr.py',
        '!dev/next_version_candidates.py',
        '!dev/pr_merge_status.py',
        '!dev/spark_jira_utils.py',
        '!dev/spark_merge_footer.py',
        ]
