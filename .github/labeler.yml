        '**/pom.xml',
        '.mvn/**/*',
        '.pre-commit-config.yaml',
        '.sbtopts',
        'assembly/**/*',
        'bin/docker-image-tool.sh',
        'bin/find-spark-home*',
        'build/**/*',
        'project/**/*',
        'pyproject.toml',
        'scalastyle-config.xml',
        ]

