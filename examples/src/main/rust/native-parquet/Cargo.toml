[package]
name = "spark-native-parquet-demo"
workspace = "../../../../../sql/native/rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spark_datasource_rust_sdk_parquet"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
spark-native-source = { path = "../../../../../sql/native/rust" }
arrow-arith = "58"
arrow-array.workspace = true
arrow-ord = "58"
arrow-schema.workspace = true
arrow-string = "58"
parquet = { version = "58", default-features = false, features = [
    "arrow",
    "flate2-rust_backened",
    "lz4",
    "snap",
    "zstd",
] }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
