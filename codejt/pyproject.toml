[project]
name = "codejt"
version = "0.1.0"
description = "CodeJT is a new application project by Jonathan Combs and Combs Contracting LLC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jonathan Combs", email = "jonathan@combscontracting.com" }
]
keywords = ["codejt", "combs", "contracting", "apache", "license"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.urls]
Home = "https://example.com/codejt"
Repository = "https://github.com/your-org/codejt"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
