[package]
name = "spark-native-source"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Experimental Rust batch data source SDK for Apache Spark PR #59313"

[workspace]
members = ["../../../examples/src/main/rust/native-data-source"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
arrow-array = { version = "58", features = ["ffi"] }
arrow-schema = { version = "58", features = ["ffi"] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
jni.workspace = true
serde.workspace = true
serde_json.workspace = true

[profile.release]
# Provider panics are translated into Java / Arrow errors by the SDK.
panic = "unwind"
