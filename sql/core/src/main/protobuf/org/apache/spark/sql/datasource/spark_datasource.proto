// The messages that Spark and a native data source exchange through the functions of
// spark_datasource.h, which describes how they are used. Since Spark 4.4.0.
//
// The messages only grow: a later release of Spark may add fields, messages and values of enums,
// but it never changes or reuses the number of a field, so a library built against an earlier
// version of this file keeps working, and ignores the fields that it does not know. Spark only
// sends a new kind of request to an object whose reply to spark_ds_open declares that it supports
// it, so a new request never reaches an older library.
syntax = "proto3";

package spark.datasource;

option java_multiple_files = true;
option java_package = "org.apache.spark.sql.execution.datasources.v2.ffi.proto";
// Lite messages have no descriptors, which the full C++ runtime registers in a pool of the
// process: two libraries that link the same libprotobuf, or two copies of one library, such as an
// installed one and the one of a package, would register spark_datasource.proto twice, which
// aborts the process. A library should still link its Protocol Buffers runtime statically, with
// hidden symbols, since libraries built against different versions of it can share a process.
option optimize_for = LITE_RUNTIME;

// ---------------------------------------------------------------------------------------------
// spark_ds_open
// ---------------------------------------------------------------------------------------------

// The request of spark_ds_open: the object to open, with what it needs.
message OpenRequest {
  // The version of Spark, such as "4.4.0".
  string spark_version = 1;
  // The newest version of these messages that Spark supports: 1.
  int32 protocol_version = 2;

  oneof object {
    // A data source, on the driver, for each schema inference, scan and write. Spark closes it
    // right after.
    DataSource data_source = 10;
    // A reader for a batch scan, on the driver.
    BatchReader batch_reader = 11;
    // A reader for a micro-batch streaming scan, on the driver. Spark keeps it until the
    // streaming query stops.
    StreamReader stream_reader = 12;
    // A writer for a batch write, or for a micro-batch of a streaming write, on the driver.
    Writer writer = 13;
    // The reader of one partition of a batch or streaming scan, on an executor.
    PartitionReader partition_reader = 14;
    // The writer of one task of a write, on an executor.
    DataWriter data_writer = 15;
  }
}

// The reply of spark_ds_open.
message OpenReply {
  // For a data source: the operations that it supports, which may depend on its name and its
  // options. Spark reports the operations that a data source does not declare as unsupported,
  // without opening a reader or a writer.
  repeated Capability capabilities = 1;
}

// An operation that a data source supports.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // Batch reads, with batch readers.
  CAPABILITY_BATCH_READ = 1;
  // Micro-batch streaming reads, with stream readers.
  CAPABILITY_MICRO_BATCH_READ = 2;
  // Batch writes, with writers.
  CAPABILITY_BATCH_WRITE = 3;
  // Streaming writes, with writers.
  CAPABILITY_STREAMING_WRITE = 4;
  // Writes with the mode WRITE_MODE_TRUNCATE.
  CAPABILITY_TRUNCATE = 5;
}

// A data source, with the options given by the user, such as spark.read.option("key", "value").
message DataSource {
  // The name of the data source, as listed in the package manifest, or in lower case for an
  // installed library. A library can implement several data sources.
  string name = 1;
  // The options, with the keys in lower case, because Spark matches them case-insensitively.
  map<string, string> options = 2;
}

message BatchReader {
  DataSource data_source = 1;
  // The schema to read: the one that the user specified, or the one that the data source infers.
  StructType schema = 2;
}

message StreamReader {
  DataSource data_source = 1;
  // The schema to read: the one that the user specified, or the one that the data source infers.
  StructType schema = 2;
}

message Writer {
  DataSource data_source = 1;
  // The schema of the data to write.
  StructType schema = 2;
  // Whether the write adds to the existing data, or replaces it.
  WriteMode mode = 3;
  // The ID of the streaming query of a streaming write, and empty for a batch write. It stays the
  // same when the query restarts from its checkpoint, so with the epoch IDs, it identifies the
  // commits of the query.
  string query_id = 4;
}

enum WriteMode {
  // Adds the data to the existing data.
  WRITE_MODE_APPEND = 0;
  // Replaces the existing data: with the save mode "overwrite" of a batch write, and in each
  // micro-batch with the output mode "complete" of a streaming write. Spark only uses it with a
  // data source that declares CAPABILITY_TRUNCATE.
  WRITE_MODE_TRUNCATE = 1;
}

message PartitionReader {
  // The task that reads the partition.
  TaskContext task = 1;
  // The state that the batch reader or the stream reader returned in its SerializeReply.
  bytes reader_state = 2;
  // A partition that the batch reader or the stream reader planned.
  bytes partition = 3;
}

message DataWriter {
  // The task that writes, with the partition that it writes.
  TaskContext task = 1;
  // The state that the writer returned in its SerializeReply.
  bytes writer_state = 2;
  // The ID of the micro-batch for a streaming write, or -1 for a batch write.
  int64 epoch_id = 3;
}

// A task of Spark, on an executor.
message TaskContext {
  // The ID of the stage of the task, and the attempt number of the stage.
  int32 stage_id = 1;
  int32 stage_attempt_number = 2;
  // The partition that the task reads or writes, and the attempt number of the task.
  int32 partition_id = 3;
  int32 attempt_number = 4;
  // The ID of the task attempt, unique in the Spark application. SparkDsHost.is_interrupted takes
  // it.
  int64 task_attempt_id = 5;
}

// ---------------------------------------------------------------------------------------------
// spark_ds_call
// ---------------------------------------------------------------------------------------------

// The request of spark_ds_call: a control operation on an object. The comment of each operation
// says on which object Spark calls it, and the reply has the field of the same name.
message CallRequest {
  oneof call {
    // On a data source, when the user does not specify a schema.
    InferSchema infer_schema = 1;
    // On a batch reader, at most once and in this order: push_predicates, push_limit and
    // prune_columns.
    PushPredicates push_predicates = 2;
    PushLimit push_limit = 3;
    PruneColumns prune_columns = 4;
    // On a batch reader, after the pushdown.
    PlanPartitions plan_partitions = 5;
    // On a batch reader after plan_partitions, on a stream reader after each
    // plan_stream_partitions, and on a writer once, after opening it.
    Serialize serialize = 6;
    // On a stream reader.
    InitialOffset initial_offset = 7;
    LatestOffset latest_offset = 8;
    PlanStreamPartitions plan_stream_partitions = 9;
    CommitOffset commit_offset = 10;
    // On a writer.
    Commit commit = 11;
    Abort abort = 12;
    // On a data writer, after the data was written.
    CommitDataWriter commit_data_writer = 13;
    AbortDataWriter abort_data_writer = 14;
  }
}

// The reply of spark_ds_call. An empty reply is valid for every request: it means that the
// operation has no result, such as a reader that does not use the pushed predicates.
message CallReply {
  oneof reply {
    InferSchemaReply infer_schema = 1;
    PushPredicatesReply push_predicates = 2;
    PushLimitReply push_limit = 3;
    PruneColumnsReply prune_columns = 4;
    PlanPartitionsReply plan_partitions = 5;
    SerializeReply serialize = 6;
    OffsetReply initial_offset = 7;
    OffsetReply latest_offset = 8;
    PlanPartitionsReply plan_stream_partitions = 9;
    CommitDataWriterReply commit_data_writer = 13;
  }
}

message InferSchema {}

message InferSchemaReply {
  // The schema of the data. Without it, the user must specify the schema.
  StructType schema = 1;
}

// Pushes predicates down to a batch reader. The predicates are combined with AND.
//
// Each predicate is a JSON expression tree. An expression is one of:
// - {"type": "column", "name": ["a", "b"]}: a column. A nested field has a name part for each
//   level.
// - {"type": "literal", "dataType": "bigint", "value": 1}: a literal. The data type is a Spark
//   SQL type name such as int, string or decimal(10,2). The value is null, a JSON boolean or
//   number for boolean and numeric types, a string for string, a base64 string for binary, a
//   decimal string for decimal, the days since the epoch for date, and the microseconds since
//   the epoch for timestamp and timestamp_ntz.
// - {"type": "function", "name": ">", "children": [...]}: a predicate, with the name it has in
//   org.apache.spark.sql.connector.expressions.filter.Predicate. The names are =, <>, <=>
//   (equal, with null equal to null), <, <=, > and >= with two children, IN with the value to
//   look for and then the values to look in, IS_NULL and IS_NOT_NULL with one child,
//   STARTS_WITH, ENDS_WITH and CONTAINS with the string and the string to look for, AND and OR
//   with two predicates, and NOT with one. The children of the other functions are columns,
//   literals or predicates.
// Spark does not pass predicates that it cannot express this way, such as predicates that use
// arithmetic or other functions, nor predicates on columns that contain strings with a
// non-binary collation, such as UTF8_LCASE: strings are compared by their UTF-8 bytes. The JSON
// is ASCII: it escapes the other characters, which any JSON parser decodes.
//
// Spark evaluates all the predicates again after reading, so a reader may use them only to skip
// data, for example the files whose statistics show that no row matches. But it must never drop
// or skip a row for which the predicates are true under the semantics of Spark SQL, which Spark
// cannot detect: see spark_datasource.h. The file
// org/apache/spark/sql/datasource/predicate-cases.json in the jar of Spark SQL lists predicates as
// Spark passes them, with the rows of a table for which they are true, to test a reader with.
message PushPredicates {
  repeated string predicates_json = 1;
}

message PushPredicatesReply {
  // How the reader uses each predicate, in the order of the request. Spark shows the predicates
  // that the reader uses as pushed in the plan of the query, and evaluates all of them again after
  // reading anyway. Missing answers are PREDICATE_USE_UNUSED.
  repeated PredicateUse uses = 1;
}

enum PredicateUse {
  // Not at all.
  PREDICATE_USE_UNUSED = 0;
  // Only to skip data, so the reader may return rows for which the predicate is not true.
  PREDICATE_USE_PARTIAL = 1;
  // To only return the rows for which the predicate is true.
  PREDICATE_USE_COMPLETE = 2;
}

// Pushes a LIMIT down to a batch reader. Spark only pushes a limit when the query does not filter
// the rows, since it evaluates the predicates after reading.
message PushLimit {
  int32 limit = 1;
}

message PushLimitReply {
  // Whether the reader returns at most `limit` rows in total. Spark applies the limit again
  // after reading either way.
  bool applied = 1;
}

// Prunes the columns that a batch reader reads.
message PruneColumns {
  // The names of the top-level columns that the query needs, which include the columns of the
  // pushed predicates. There may be none, for example for SELECT count(*): then the batches only
  // have a number of rows.
  repeated string columns = 1;
}

message PruneColumnsReply {
  // Whether the partition readers return exactly these columns, in this order. If not, they return
  // all the columns of the schema to read.
  bool pruned = 1;
}

// Plans the partitions of a batch scan. Spark reads each partition in a separate task.
message PlanPartitions {}

message PlanPartitionsReply {
  // The partitions, serialized in a format defined by the library.
  repeated bytes partitions = 1;
}

// Serializes the state of a reader or a writer that its partition readers or data writers need
// on the executors, such as the pushed predicates.
message Serialize {}

message SerializeReply {
  // The state, in a format defined by the library, or empty if there is none.
  bytes state = 1;
}

// Returns the offset to start from when the streaming query has no checkpoint.
message InitialOffset {}

// Returns the most recent offset available.
message LatestOffset {}

message OffsetReply {
  // The offset, as compact JSON on a single line: Spark stores each offset as a line of the offset
  // log of the checkpoint, so it rejects an offset that is not valid JSON or contains a line break.
  string offset_json = 1;
}

// Plans the partitions that read the data after `start` up to and including `end`. When a
// streaming query restarts, from its checkpoint, Spark may plan the last range that it planned
// before again, so the partitions of a range must read the same data each time.
message PlanStreamPartitions {
  string start_json = 1;
  string end_json = 2;
}

// Tells the library that Spark has processed all the data up to and including `end`, and will not
// ask for it again.
message CommitOffset {
  string end_json = 1;
}

// Commits a write, when all its tasks succeeded. Spark may commit the same epoch of a streaming
// query more than once, for example when the query restarts after a failure, so committing an
// epoch that is already committed must have no effect, for exactly-once output.
message Commit {
  // The ID of the micro-batch for a streaming write, or -1 for a batch write.
  int64 epoch_id = 1;
  // The messages that the data writers of the tasks returned, one for each partition.
  repeated TaskMessage messages = 2;
}

// Aborts a write, when it failed, including when its commit failed.
message Abort {
  // The ID of the micro-batch for a streaming write, or -1 for a batch write.
  int64 epoch_id = 1;
  // The messages that the data writers of the tasks returned. A task that did not commit has no
  // message.
  repeated TaskMessage messages = 2;
}

message TaskMessage {
  // Whether the task committed, and so whether `message` is set.
  bool committed = 1;
  bytes message = 2;
}

// Commits the data that a data writer wrote. If it fails, Spark aborts the data writer. If it
// succeeds, Spark does not abort it, even if it then fails the task, for example because the
// reply is invalid.
message CommitDataWriter {}

message CommitDataWriterReply {
  // The message to pass to the commit of the writer on the driver.
  bytes message = 1;
}

// Aborts the data that a data writer wrote.
message AbortDataWriter {}

// ---------------------------------------------------------------------------------------------
// spark_ds_stream
// ---------------------------------------------------------------------------------------------

// The request of spark_ds_stream: a data operation on an object, through Arrow C streams.
message StreamRequest {
  oneof stream {
    // On a partition reader: initializes the output stream with the batches of the partition.
    Read read = 1;
    // On a data writer: reads the batches of the input stream and writes them.
    Write write = 2;
  }
}

message Read {}

message Write {}

// ---------------------------------------------------------------------------------------------
// Schemas
// ---------------------------------------------------------------------------------------------

// A schema: the columns of the data, as Spark SQL types. The data itself is Arrow, with the types
// of spark.sql.execution.arrow: for example, bigint is int64, string is utf8, timestamp is
// timestamp[us] with a time zone and timestamp_ntz is timestamp[us] without one.
message StructType {
  repeated StructField fields = 1;
}

message StructField {
  string name = 1;
  DataType data_type = 2;
  bool nullable = 3;
}

// A Spark SQL type.
message DataType {
  oneof kind {
    Null null = 1;
    Boolean boolean = 2;
    Byte byte = 3;
    Short short = 4;
    Integer integer = 5;
    Long long = 6;
    Float float = 7;
    Double double = 8;
    Decimal decimal = 9;
    String string = 10;
    Binary binary = 11;
    Date date = 12;
    Timestamp timestamp = 13;
    TimestampNtz timestamp_ntz = 14;
    YearMonthInterval year_month_interval = 15;
    DayTimeInterval day_time_interval = 16;
    CalendarInterval calendar_interval = 17;
    Array array = 18;
    Map map = 19;
    StructType struct = 20;
  }

  message Null {}
  message Boolean {}
  message Byte {}
  message Short {}
  message Integer {}
  message Long {}
  message Float {}
  message Double {}

  message Decimal {
    int32 precision = 1;
    int32 scale = 2;
  }

  message String {
    // The collation of the strings, such as "UTF8_LCASE", or empty for UTF8_BINARY.
    string collation = 1;
  }

  message Binary {}
  message Date {}
  message Timestamp {}
  message TimestampNtz {}

  // The fields are those of org.apache.spark.sql.types.YearMonthIntervalType: 0 for YEAR and 1 for
  // MONTH.
  message YearMonthInterval {
    int32 start_field = 1;
    int32 end_field = 2;
  }

  // The fields are those of org.apache.spark.sql.types.DayTimeIntervalType: 0 for DAY, 1 for
  // HOUR, 2 for MINUTE and 3 for SECOND.
  message DayTimeInterval {
    int32 start_field = 1;
    int32 end_field = 2;
  }

  message CalendarInterval {}

  message Array {
    DataType element_type = 1;
    bool contains_null = 2;
  }

  message Map {
    DataType key_type = 1;
    DataType value_type = 2;
    bool value_contains_null = 3;
  }
}
